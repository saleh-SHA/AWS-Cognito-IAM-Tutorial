site_name: AWS Cognito + IAM Tutorial
site_description: An in-depth course on Cognito, IAM, and application authorisation, from first principles to production architectures.
site_url: https://saleh-sha.github.io/AWS-Cognito-IAM-Tutorial/
repo_url: https://github.com/saleh-SHA/AWS-Cognito-IAM-Tutorial
repo_name: saleh-SHA/AWS-Cognito-IAM-Tutorial
theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
extra_css:
  - stylesheets/extra-v3.css
extra_javascript:
  - scripts/landing-layout.js
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
nav:
  - Overview: index.md
  - Chapter 1: chapter-01.md
  - Chapter 2: chapter-02.md
  - Chapter 3: chapter-03.md
  - Chapter 4: chapter-04.md
  - Chapter 5: chapter-05.md
  - Chapter 6: chapter-06.md
  - Chapter 7: chapter-07.md
  - Chapter 8: chapter-08.md
  - Chapter 9: chapter-09.md
  - Chapter 10: chapter-10.md
  - Chapter 11: chapter-11.md
  - Chapter 12: chapter-12.md
  - Download the PDF: AWS_Cognito_vs_IAM_Expanded_Deep_Dive_Tutorial.pdf
